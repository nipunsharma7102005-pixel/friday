<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F.R.I.D.A.Y.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b14;--panel:#0a1626;--line:#16384f;--glow:#35e0ff;--glow2:#ffb43a;--text:#d6f4ff;--dim:#7fa6b8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-suit="gold"]{--bg:#120505;--panel:#1d0b0b;--line:#5a2218;--glow:#ffb43a;--glow2:#ff4a3a;--text:#ffeccc;--dim:#c79a7a}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 28%,color-mix(in srgb,var(--glow) 14%,var(--bg)),var(--bg) 62%);color:var(--text);font-family:Rajdhani,"Segoe UI",system-ui,sans-serif;font-size:18px;display:flex;flex-direction:column;align-items:center;transition:background .6s}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.015) 3px 4px);pointer-events:none}
header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px 0}
h1{font-family:Orbitron,Rajdhani,sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:.3em;margin:0;color:var(--glow);text-shadow:0 0 14px var(--glow)}
#status{color:var(--dim);font-size:.95rem}
.reactor{position:relative;width:min(36vh,230px);aspect-ratio:1;margin:14px 0 6px;flex:none}
.reactor svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{animation:spin 24s linear infinite;transform-origin:50% 50%}
.r2{animation:spin 14s linear infinite reverse;transform-origin:50% 50%}
.core{fill:var(--glow);filter:drop-shadow(0 0 12px var(--glow));animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 50%}
.reactor.listening .core{animation-duration:.7s;fill:var(--glow2);filter:drop-shadow(0 0 18px var(--glow2))}
.reactor.speaking .core{animation-duration:.35s}
.reactor.listening .r1,.reactor.speaking .r1{animation-duration:6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.18);opacity:.75}}
#log{flex:1;min-height:0;width:100%;max-width:760px;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:9px 14px;border:1px solid var(--line);background:var(--panel);line-height:1.35;border-radius:2px 14px 14px 14px}
.m.f{border-left:3px solid var(--glow);align-self:flex-start}
.m.u{align-self:flex-end;border-radius:14px 2px 14px 14px;border-right:3px solid var(--glow2);color:var(--dim)}
.m a{color:var(--glow2);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 16px;max-width:760px}
.chips button{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:.95rem;padding:3px 12px;border-radius:99px;cursor:pointer}
.chips button:hover{color:var(--glow);border-color:var(--glow)}
form{display:flex;gap:10px;width:100%;max-width:760px;padding:8px 16px 16px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;padding:12px 14px;border-radius:6px}
input::placeholder{color:var(--dim)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.btn{background:var(--panel);border:1px solid var(--glow);color:var(--glow);font:600 1rem Rajdhani,sans-serif;padding:0 16px;border-radius:6px;cursor:pointer}
.btn.mic{width:50px;padding:0;font-size:1.3rem}
.btn.mic.on{background:var(--glow2);border-color:var(--glow2);color:#000}
@media (prefers-reduced-motion:reduce){.r1,.r2,.core{animation:none}}
</style>
</head>
<body>
<header><h1>F.R.I.D.A.Y.</h1><span id="status">Online</span></header>

<div class="reactor" id="reactor" aria-hidden="true">
  <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="96" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <g class="r1"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--glow)" stroke-width="3" stroke-dasharray="40 14 8 14" opacity=".85"/></g>
    <g class="r2"><circle cx="100" cy="100" r="68" fill="none" stroke="var(--glow2)" stroke-width="2" stroke-dasharray="3 9" opacity=".9"/></g>
    <circle cx="100" cy="100" r="50" fill="none" stroke="var(--glow)" stroke-width="1.5" opacity=".6"/>
    <polygon points="100,70 126,115 74,115" fill="none" stroke="var(--glow)" stroke-width="2" opacity=".8"/>
    <circle class="core" cx="100" cy="100" r="16"/>
  </svg>
</div>

<div id="log" role="log" aria-live="polite"></div>

<div class="chips" id="chips"></div>

<form id="form" autocomplete="off">
  <button type="button" class="btn mic" id="mic" aria-label="Speak a command">🎤</button>
  <input id="inp" placeholder="Ask Friday something…" aria-label="Command">
  <button class="btn" type="submit">Send</button>
</form>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), reactor = $('reactor'), statusEl = $('status');
let voiceOn = true;

function add(text, who) {
  const d = document.createElement('div');
  d.className = 'm ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function say(text, link) {
  const d = add(text, 'f');
  if (link) {
    d.appendChild(document.createTextNode(' '));
    const a = document.createElement('a');
    a.href = link.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = link.label;
    d.appendChild(a);
  }
  if (voiceOn && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN'; u.rate = 1.02;
    u.onstart = () => { reactor.classList.add('speaking'); statusEl.textContent = 'Speaking'; };
    u.onend = u.onerror = () => { reactor.classList.remove('speaking'); statusEl.textContent = 'Online'; };
    speechSynthesis.speak(u);
  }
}

const jokes = [
  'Why do programmers prefer dark mode? Because light attracts bugs.',
  'I would tell you a UDP joke, but you might not get it.',
  'There are 10 kinds of people: those who understand binary and those who don’t.'
];
const pick = a => a[Math.floor(Math.random() * a.length)];

function handle(raw) {
  const c = raw.toLowerCase().trim();
  if (!c) return;
  add(raw, 'u');
  let m;
  if (/^(hi|hello|hey|namaste|friday)\b/.test(c)) return say(pick(['Hello, boss. Systems are online.', 'Namaste, boss. Kya karna hai aaj?']));
  if (/who are you|your name/.test(c)) return say('I’m F.R.I.D.A.Y., your personal assistant. Built with HTML, CSS and JavaScript.');
  if (/time/.test(c)) return say('It’s ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) + ', boss.');
  if (/date|today|day is/.test(c)) return say('Today is ' + new Date().toLocaleDateString([], {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}) + '.');
  if (/joke/.test(c)) return say(pick(jokes));
  if (/suit up/.test(c)) { document.documentElement.dataset.suit = 'gold'; return say('Suit up. Red and gold, as always.'); }
  if (/(stand down|cyan|reset theme)/.test(c)) { delete document.documentElement.dataset.suit; return say('Standing down. Back to blue.'); }
  if (/toss|coin/.test(c)) return say('It’s ' + (Math.random() < .5 ? 'heads.' : 'tails.'));
  if (/dice|roll/.test(c)) return say('You rolled a ' + (1 + Math.floor(Math.random() * 6)) + '.');
  if (/mute|be quiet/.test(c)) { voiceOn = false; speechSynthesis.cancel(); return say('Voice muted.'); }
  if (/unmute|speak/.test(c) && !/search/.test(c)) { voiceOn = true; return say('Voice back on.'); }
  if ((m = c.match(/timer (?:for )?(\d+)\s*(sec|second|min|minute)/))) {
    const n = +m[1], ms = n * (m[2].startsWith('min') ? 60000 : 1000);
    setTimeout(() => say('Timer complete, boss.'), ms);
    return say('Timer set for ' + n + ' ' + m[2] + (n > 1 ? 's' : '') + '.');
  }
  const expr = c.replace(/^(calculate|calc|what is|what’s|what's)\s*/, '').replace(/\bx\b|into|times/g, '*').replace(/plus/g, '+').replace(/minus/g, '-').replace(/divided by/g, '/');
  if (/\d/.test(expr) && /^[\d\s+\-*/().%]+$/.test(expr)) {
    try { const r = Function('"use strict";return (' + expr + ')')(); if (isFinite(r)) return say('The answer is ' + +r.toFixed(6) + '.'); } catch (e) {}
  }
  const sites = {youtube: 'https://www.youtube.com', google: 'https://www.google.com', maps: 'https://maps.google.com', gmail: 'https://mail.google.com', github: 'https://github.com'};
  if ((m = c.match(/open (\w+)/)) && sites[m[1]]) return say('Here you go, boss.', {url: sites[m[1]], label: 'Open ' + m[1]});
  if (/weather/.test(c)) return say('I can’t read live weather here, but this will.', {url: 'https://www.google.com/search?q=weather', label: 'Check weather'});
  if ((m = c.match(/^(?:search|google|find)\s+(?:for\s+)?(.+)/))) return say('Searching for ' + m[1] + '.', {url: 'https://www.google.com/search?q=' + encodeURIComponent(m[1]), label: 'See results'});
  say('I didn’t get that, boss. Try “time”, “tell me a joke”, “calculate 12 * 7”, “search black holes” or “suit up”.');
}

$('form').addEventListener('submit', e => { e.preventDefault(); const v = $('inp').value; $('inp').value = ''; handle(v); });

['What time is it', 'Tell me a joke', 'Calculate 48 * 12', 'Timer for 10 seconds', 'Open youtube', 'Suit up'].forEach(t => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
  b.onclick = () => handle(t); $('chips').appendChild(b);
});

// Voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('mic');
if (!SR) { mic.disabled = true; mic.title = 'Voice input is not supported in this browser'; }
else {
  const rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = false;
  rec.onstart = () => { mic.classList.add('on'); reactor.classList.add('listening'); statusEl.textContent = 'Listening'; };
  rec.onend = () => { mic.classList.remove('on'); reactor.classList.remove('listening'); statusEl.textContent = 'Online'; };
  rec.onresult = e => handle(e.results[0][0].transcript);
  rec.onerror = e => say(e.error === 'not-allowed' ? 'Microphone access is blocked. Allow it in your browser settings and try again.' : 'I couldn’t hear you. Tap the mic and try again.');
  mic.onclick = () => { try { rec.start(); } catch (e) {} };
}

say('Good to see you, boss. All systems are online. Type or tap the mic and give me a command.');
</script>
</body>
</html>
